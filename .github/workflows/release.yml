name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance:
    name: Verify public distribution rights
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify project license and asset provenance
        run: npm run release:preflight:public

  build:
    name: Build and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            eb_flag: --win
          - os: macos-latest
            eb_flag: --mac
          - os: ubuntu-latest
            eb_flag: --linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web renderer
        run: npm run build -w @mediatoolbox/web

      - name: Build local API runtime
        run: npm run build -w @mediatoolbox/api

      - name: Build desktop main process
        run: npm run build -w @mediatoolbox/desktop

      - name: Release preflight
        run: npm run release:preflight

      - name: Package Electron app
        run: npx electron-builder ${{ matrix.eb_flag }} --publish never
        working-directory: apps/desktop

      - name: Install virtual display for Linux renderer smoke
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Smoke test packaged renderer
        run: npm run release:smoke:packaged

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish coordinated release
    needs: [governance, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all platform artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: release-artifacts

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mapfile -d '' artifacts < <(find release-artifacts -type f -print0)
          if (( ${#artifacts[@]} == 0 )); then
            echo 'No release artifacts were downloaded.' >&2
            exit 1
          fi
          duplicate_names=$(printf '%s\n' "${artifacts[@]##*/}" | sort | uniq -d)
          if [[ -n "$duplicate_names" ]]; then
            echo 'Duplicate release artifact names are not allowed:' >&2
            echo "$duplicate_names" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published; use a new tag instead of replacing immutable artifacts." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "${artifacts[@]}" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
