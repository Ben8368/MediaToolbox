name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            eb_flag: --win
          - os: macos-latest
            eb_flag: --mac
          - os: ubuntu-latest
            eb_flag: --linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web renderer
        run: npm run build -w @mediatoolbox/web

      - name: Build local API runtime
        run: npm run build -w @mediatoolbox/api

      - name: Build desktop main process
        run: npm run build -w @mediatoolbox/desktop

      - name: Release preflight
        run: npm run release:preflight

      - name: Package Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.eb_flag }} --publish always
        working-directory: apps/desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest*.yml
          if-no-files-found: ignore
          retention-days: 7
